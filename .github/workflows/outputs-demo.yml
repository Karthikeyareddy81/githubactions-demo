name: Outputs demo
on: workflow_dispatch
jobs:
  build:
    outputs:
      release: ${{steps.step1.outputs.version}}
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        id: step1
        run: echo "version=v1.1.0" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the app
        run: echo "We are deploying the app with version ${{needs.build.outputs.release}}"
    
    
        
